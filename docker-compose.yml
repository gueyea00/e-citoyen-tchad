version: '3.8'

services:
  db:
    image: postgres:15
    container_name: e_citoyen_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: ecitoyen_db
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d ecitoyen_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: e_citoyen_backend
    ports:
      - "5007:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://admin:admin_password@db:5432/ecitoyen_db?schema=public
      - JWT_SECRET=supersécurisé
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run dev"

volumes:
  pgdata:
