services:
  # Le Backend (Express + Prisma + TypeScript)
  - type: web
    name: e-citoyen-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run db:seed && npm run build

    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e-citoyen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render va générer une valeur aléatoire sécurisée
      - key: GROQ_API_KEY
        sync: false # À configurer manuellement dans le dashboard Render
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0

  # Le Frontend (Vite + Shadcn UI)
  - type: web
    name: e-citoyen-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: e-citoyen-backend
          property: host

# La base de données PostgreSQL
databases:
  - name: e-citoyen-db
    plan: free
    databaseName: ecitoyendb
    user: ecitoyenuser
